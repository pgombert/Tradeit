services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeit-postgres
    environment:
      POSTGRES_USER: tradeit
      POSTGRES_PASSWORD: tradeit_dev
      POSTGRES_DB: tradeit
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradeit-redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
